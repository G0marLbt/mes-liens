<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ressources et liens utiles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            font-size: 17px;
            margin-bottom: 30px;
            color: #4b5563;
        }

        .button {
            display: block;
            width: 100%;
            padding: 22px;
            margin: 18px 0;
            border-radius: 14px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: scale(1.02);
        }

        .techlab {
            background: #2563eb;
        }

        .creth {
            background: #15803d;
        }

        .hitclic {
            background: #ea580c;
        }

        .button:focus {
            outline: 4px solid #111827;
            outline-offset: 3px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Ressources et liens utiles</h1>

        <p>Découvrez nos différentes ressources</p>

        <a class="button techlab"
           href="https://techlab-handicap.org/"
           target="_blank"
           rel="noopener noreferrer">
            Techlab APF France handicap
        </a>

        <a class="button creth"
           href="https://www.creth.be/"
           target="_blank"
           rel="noopener noreferrer">
            CRETH
        </a>

        <a class="button hitclic"
           href="https://hitclic.shop/"
           target="_blank"
           rel="noopener noreferrer">
            HitClic – Projet Handigamer
        </a>

    </main>

</body>
</html>
